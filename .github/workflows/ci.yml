name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Coverage check
        run: cargo llvm-cov --lib --fail-under-lines 20

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm i --frozen-lockfile

      - name: Wasmup install
        run: pnpm exec wasmup install

      - name: Build
        run: pnpm build

      - name: Type Check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint


  base:
    strategy:
      matrix:
        os: [ubuntu-latest]
        node_version: [20, 22]
        include:
          - os: macos-latest
            node_version: 22
          - os: windows-latest
            node_version: 22
      fail-fast: false

    runs-on: ${{ matrix.os }}

    name: "node-${{ matrix.node_version }}, ${{ matrix.os }}"

    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set node ${{ matrix.node_version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node_version }}
          cache: pnpm

      - name: Install
        run: pnpm i --frozen-lockfile

      - name: wasmup install
        run: pnpm exec wasmup install

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test
